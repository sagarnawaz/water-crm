<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No internet · Paani Register</title>
<style>
  :root { --bg:#eef3f6; --ink:#0e2430; --muted:#587080; --accent:#0a6a93; --accent-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a151b; --ink:#e4edf1; --muted:#8ca2ae; --accent:#4db4e2; --accent-ink:#04202d; color-scheme: dark; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px max(16px, env(safe-area-inset-left)); box-sizing:border-box; }
  main { max-width:360px; display:flex; flex-direction:column; gap:14px; }
  img { width:56px; height:56px; border-radius:16px; }
  h1 { margin:0; font-size:24px; }
  p { margin:0; color:var(--muted); }
  button { min-height:52px; border:0; border-radius:12px; background:var(--accent); color:var(--accent-ink); font:600 16px system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No internet</h1>
  <p>Paani Register needs internet to open and save records. Everything you already saved is safe.</p>
  <p>Check your mobile data or Wi-Fi, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
